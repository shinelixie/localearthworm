# 端口说明：本机可能同时跑着上游 cuixueshe/earthworm（占 5433/6379/5480/6380/3010/3000），
# 所以本地版一律错开一位：主库 5434、Redis 6381、测试库 5481、测试 Redis 6382。
# 本地版免登录（LOCAL_MODE），不需要 Logto，因此这里不再包含 logto / logtoPostgres。
services:
  db:
    restart: always
    image: postgres:14-alpine
    user: postgres
    environment:
      POSTGRES_USER: postgres
      # 无密码（host 连接走 trust），与 apps/api/.env 的 DATABASE_URL（postgres@127.0.0.1:5434）保持一致
      POSTGRES_PASSWORD: ""
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: earthworm
    volumes:
      - data:/var/lib/postgres/main-data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - 5434:5432
  testdb:
    image: postgres:14-alpine
    user: postgres
    volumes:
      - data:/var/lib/postgres/test-data
    environment:
      POSTGRES_USER: test
      # 密码须与 apps/api/.env.test 的 DATABASE_URL（test:password@localhost:5481）一致
      POSTGRES_PASSWORD: password
      POSTGRES_DB: earthworm_test
    ports:
      - 5481:5432
  redis:
    image: redis:5-alpine
    restart: always
    volumes:
      - data:/var/lib/redis
    ports:
      - 6381:6379
  testRedis:
    image: redis:5-alpine
    volumes:
      - data:/var/lib/test-redis
    ports:
      - 6382:6379

volumes:
  data:
    driver: local
